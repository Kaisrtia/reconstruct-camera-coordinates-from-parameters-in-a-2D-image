[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-reconstruction"
version = "0.1.0"
description = "Reconstruct camera coordinates from 2D image parameters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "jinja2>=3.1.0",
  "numpy>=1.26.0",
  "matplotlib>=3.8.0",
  "opencv-python>=4.9.0",
  "python-multipart>=0.0.9",
  "pandas>=2.2.0",
  "streamlit>=1.40.0",
  "uvicorn[standard]>=0.30.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"camera_reconstruction.web" = [
  "templates/*.html",
  "static/css/*.css",
  "streamlit_app.py",
]
